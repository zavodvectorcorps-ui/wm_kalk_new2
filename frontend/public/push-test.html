<!DOCTYPE html>
<html>
<head>
    <title>Push Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px 0; width: 100%; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; white-space: pre-wrap; font-family: monospace; font-size: 12px; max-height: 300px; overflow: auto; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>🔔 Push Test</h1>
    
    <div id="status"></div>
    
    <button onclick="checkSupport()">1. Проверить поддержку</button>
    <button onclick="requestPermission()">2. Запросить разрешение</button>
    <button onclick="subscribe()">3. Подписаться на Push</button>
    <button onclick="sendTest()">4. Отправить тест</button>
    
    <div class="log" id="log"></div>

    <script>
        const VAPID_KEY = 'BJTzkaMvUO1s6uOYYjPwwi0UDpBvJpwHB0TYWFkNLGsrhbTxlVnJ2LEdaErMx0GdLBfjsQDqgvmHjuzAEuz7p9A';
        const API_URL = window.location.origin;
        
        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const span = document.createElement('div');
            span.className = type;
            span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            el.appendChild(span);
            el.scrollTop = el.scrollHeight;
        }
        
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
        
        async function checkSupport() {
            log('Проверка поддержки...');
            
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            
            log(`iOS: ${isIOS}`, isIOS ? 'info' : 'success');
            log(`Standalone (PWA): ${isStandalone}`, isStandalone ? 'success' : 'error');
            log(`serviceWorker: ${'serviceWorker' in navigator}`, 'serviceWorker' in navigator ? 'success' : 'error');
            log(`PushManager: ${'PushManager' in window}`, 'PushManager' in window ? 'success' : 'error');
            log(`Notification: ${'Notification' in window}`, 'Notification' in window ? 'success' : 'error');
            
            if (isIOS && !isStandalone) {
                log('⚠️ На iPhone нужно добавить на главный экран!', 'error');
            }
            
            if ('Notification' in window) {
                log(`Текущее разрешение: ${Notification.permission}`, Notification.permission === 'granted' ? 'success' : 'info');
            }
        }
        
        async function requestPermission() {
            log('Запрос разрешения...');
            try {
                const permission = await Notification.requestPermission();
                log(`Результат: ${permission}`, permission === 'granted' ? 'success' : 'error');
            } catch (e) {
                log(`Ошибка: ${e.message}`, 'error');
            }
        }
        
        async function subscribe() {
            log('Подписка...');
            try {
                const registration = await navigator.serviceWorker.ready;
                log('Service Worker готов');
                
                log(`VAPID key: ${VAPID_KEY.substring(0, 20)}...`);
                
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_KEY)
                });
                
                log('Подписка создана!', 'success');
                log(`Endpoint: ${subscription.endpoint.substring(0, 50)}...`);
                
                // Get auth token
                const token = localStorage.getItem('authToken');
                if (!token) {
                    log('Нет токена авторизации! Войдите в систему.', 'error');
                    return;
                }
                
                // Send to server
                const response = await fetch(`${API_URL}/api/notifications/subscribe`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        endpoint: subscription.endpoint,
                        keys: {
                            p256dh: btoa(String.fromCharCode(...new Uint8Array(subscription.getKey('p256dh')))),
                            auth: btoa(String.fromCharCode(...new Uint8Array(subscription.getKey('auth'))))
                        }
                    })
                });
                
                const data = await response.json();
                log(`Сервер: ${JSON.stringify(data)}`, response.ok ? 'success' : 'error');
                
            } catch (e) {
                log(`Ошибка: ${e.name}: ${e.message}`, 'error');
                console.error(e);
            }
        }
        
        async function sendTest() {
            log('Отправка теста...');
            const token = localStorage.getItem('authToken');
            if (!token) {
                log('Нет токена! Войдите в систему.', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/notifications/send-custom`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        driverId: 'drv-test-001',
                        message: 'Тестовое уведомление!'
                    })
                });
                
                const data = await response.json();
                log(`Ответ: ${JSON.stringify(data)}`, response.ok ? 'success' : 'error');
            } catch (e) {
                log(`Ошибка: ${e.message}`, 'error');
            }
        }
        
        // Initial check
        checkSupport();
    </script>
</body>
</html>
